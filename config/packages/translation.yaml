framework:
    default_locale: en
    enabled_locales: ['en', 'fr']
    # First visit: follow the browser language. Afterwards the choice made with the
    # language switch is stored in the session (see App\EventSubscriber\LocaleSubscriber).
    set_locale_from_accept_language: true
    set_content_language_from_locale: true
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: ['en']
        providers:
