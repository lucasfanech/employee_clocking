# ---- Landing
"Know when you can leave.": "Sachez quand vous pouvez partir."
"Time card · Monday to Friday": "Carte de pointage · du lundi au vendredi"
"Type your four times of the day. Clocking balances each day against your weekly hours, adds the week up and shows the exact time you can go home.": "Saisissez vos quatre heures de la journée. Clocking calcule le bilan de chaque jour par rapport à vos heures hebdomadaires, cumule la semaine et affiche l'heure exacte à laquelle vous pouvez rentrer."
"The first account created becomes the administrator.": "Le premier compte créé devient administrateur."
"Friday": "Vendredi"
"live": "en direct"
"You can leave at": "Vous pouvez partir à"
"With the week balance": "Avec le solde de la semaine"
"Sample week · 38h30 · 1h lunch · 45 min on Friday": "Semaine exemple · 38h30 · 1h de pause · 45 min le vendredi"
"How it works": "Comment ça marche"
"Four punches a day. Nothing else to remember.": "Quatre pointages par jour. Rien d'autre à retenir."
"Type the times when you have them. Every number on the page updates as you type; save when the day is done.": "Saisissez les heures quand vous les avez. Chaque chiffre de la page se met à jour pendant la saisie ; enregistrez quand la journée est finie."
"Morning in": "Arrivée"
"Your leaving-time estimate appears the moment you clock in.": "L'estimation de votre heure de sortie apparaît dès que vous pointez."
"Lunch out": "Départ déjeuner"
"The break is checked against the minimum you set. Shorter breaks are not credited.": "La pause est comparée au minimum que vous avez fixé. Une pause plus courte n'est pas créditée."
"Back from lunch": "Retour déjeuner"
"Took longer? The estimate moves back by exactly the extra minutes.": "Pause plus longue ? L'estimation recule exactement des minutes supplémentaires."
"Evening out": "Départ"
"The day is balanced to the minute and added to the week.": "La journée est soldée à la minute et ajoutée à la semaine."
"A fair lunch-break rule": "Une règle de pause équitable"
"A break shorter than the minimum is not credited, so the clock cannot be gamed. Choose the days where a shorter break is fine.": "Une pause plus courte que le minimum n'est pas créditée : impossible de tricher avec la pendule. Choisissez les jours où une pause plus courte est acceptée."
"The week adds up": "La semaine s'additionne"
"Daily balances cumulate from Monday to Friday and shift the time you can leave today: ahead, leave earlier; behind, stay a bit.": "Les bilans quotidiens se cumulent du lundi au vendredi et décalent votre heure de sortie du jour : en avance, partez plus tôt ; en retard, restez un peu."
"Days off in one click": "Jours de repos en un clic"
"A day off leaves the week entirely: no balance, no estimate, no noise. Click again to bring it back.": "Un jour de repos sort complètement de la semaine : ni bilan, ni estimation, ni bruit. Un second clic le réintègre."
"Ready to leave on time?": "Prêt à partir à l'heure ?"
"Create your account, set your weekly hours and lunch break, and clock in tomorrow morning.": "Créez votre compte, réglez vos heures hebdomadaires et votre pause déjeuner, et pointez dès demain matin."
"I already have one": "J'en ai déjà un"

